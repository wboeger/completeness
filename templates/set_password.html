<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Definir Senha — Porcentômetro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f6f9; }
        .card { background: white; padding: 2.5rem 3rem; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.12); width: 100%; max-width: 420px; }
        h2 { margin: 0 0 .25rem; color: #2c3e50; }
        .subtitle { color: #7f8c8d; font-size: .9rem; margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: .3rem; color: #34495e; }
        input[type=password] { width: 100%; padding: .6rem .8rem; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; box-sizing: border-box; margin-bottom: 1rem; }
        input[type=password]:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 2px rgba(52,152,219,.2); }
        button { width: 100%; padding: .75rem; background: #27ae60; color: white; border: none; border-radius: 5px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #219a52; }
        .flash { padding: .6rem 1rem; border-radius: 5px; margin-bottom: 1rem; font-size: .9rem; }
        .flash.danger  { background: #fde8e8; color: #c0392b; border: 1px solid #f5c6c6; }
        .rules { font-size: .82rem; color: #7f8c8d; margin-top: -.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="card">
    <h2>Bem-vindo(a), {{ username }}!</h2>
    <p class="subtitle">Este é seu primeiro acesso. Crie uma senha para continuar.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="password">Nova senha</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required autofocus>
        <p class="rules">Mínimo de 6 caracteres.</p>

        <label for="confirm">Confirme a senha</label>
        <input type="password" id="confirm" name="confirm" placeholder="Repita a senha" required>

        <button type="submit">Definir senha e entrar</button>
    </form>
</div>
</body>
</html>
